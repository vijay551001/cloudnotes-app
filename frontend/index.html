<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CloudNotes Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 500px; margin: 50px auto; background: #f4f7f6; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; padding: 12px; margin: 5px 0; border-radius: 4px; border-left: 5px solid #007bff; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 CloudNotes Practice App</h2>
        <input type="text" id="noteInput" placeholder="Write a quick note...">
        <button onclick="addNote()">Save Note</button>
        <ul id="notesList"></ul>
    </div>

    <script>
        const API_URL = '/api/notes';

        async function fetchNotes() {
            try {
                const res = await fetch(API_URL);
                const notes = await res.json();
                const list = document.getElementById('notesList');
                list.innerHTML = '';
                notes.forEach(n => {
                    const li = document.createElement('li');
                    li.textContent = n.text;
                    list.appendChild(li);
                });
            } catch (err) { console.error("Error fetching notes:", err); }
        }

        async function addNote() {
            const text = document.getElementById('noteInput').value;
            if(!text.trim()) return;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                document.getElementById('noteInput').value = '';
                fetchNotes();
            } catch (err) { console.error("Error adding note:", err); }
        }
        fetchNotes();
    </script>
</body>
</html>
