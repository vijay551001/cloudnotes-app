
version: '3.8'

services:
  # 🍃 Service 1: The Database Container
  notes-db:
    image: mongo:7.0
    container_name: notes-database
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 🛠️ Service 2: The Backend Node.js API
  notes-backend:
    container_name: notes-api
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://notes-db:27017
    depends_on:
      - notes-db

  notes-proxy:
    image: nginx:alpine
    container_name: notes-web-proxy
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - notes-backend


volumes:
  mongo-data:
